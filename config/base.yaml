# Shared defaults. Precedence (low -> high): base -> env/<env> -> tenants/<tenant> -> CLI.
env: dev

paths:
  # Base folder for generated layers. Defaults to ./data; set SAAS_DATA_ROOT to write elsewhere
  # (e.g. the Linux filesystem in WSL, much faster than /mnt/<drive>).
  data_root: ${oc.env:SAAS_DATA_ROOT,data}
  root: ${paths.data_root}
  raw: data/raw  # RAW is read-only input and shared by every environment
  bronze: ${paths.root}/bronze
  silver: ${paths.root}/silver
  gold: ${paths.root}/gold
  quarantine_root: ${paths.root}
  quality_logs: ${paths.root}/shared/quality_logs

storage:
  # path: Delta tables by path, with the layout of architecture 5.2 (this test).
  # catalog: Unity Catalog names <catalog>.<layer>_<tenant>.<table> (Databricks).
  mode: path
  catalog: saas_${env}

sources:
  deliveries: global_mobility_data_entrega_productos.csv
  materials: materials_catalog.csv

execution:
  start_date: "2025-01-01"
  end_date: "2025-06-30"
  tenant: all
  fail_fast: false

quality:
  fail_on_critical: false
  max_quarantine_rate: 0.05  # warning above 5% of the rows read in Silver

gold:
  top_materials_n: 5  # materials kept per tenant and month in top_materials_by_month

business:
  units_per_case: 20
  routine_delivery_types: [ZPRE, ZVE1]
  bonus_delivery_types: [Z04, Z05]

# Filled by the tenant file (config/tenants/<code>.yaml)
tenant:
  code: ???
  enabled: true
