name: ci

on:
  # Every pull request, plus pushes to main (merges). Without the branch filter, each push to a
  # branch with an open PR would run the same job twice.
  push:
    branches: [main]
  pull_request:

# A newer commit on the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4  # Spark 3.5 runs on the JVM
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python 3.11

      - name: Lint (ruff, PEP8)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Validate YAML configuration
        run: uv run saas-pipeline validate-config

      - name: Unit tests
        run: uv run pytest

      # The wheel is what gets installed on Databricks: it must build and only require omegaconf.
      - name: Build package
        run: |
          uv build --wheel -o dist
          unzip -p dist/*.whl '*/METADATA' | grep '^Requires-Dist'
          ! unzip -p dist/*.whl '*/METADATA' | grep -E '^Requires-Dist: (pyspark|delta-spark)'
